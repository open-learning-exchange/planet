<planet-list-toolbar [searchValue]="searchValue">
  <button mat-icon-button (click)="back()"><mat-icon>arrow_back</mat-icon></button>
  <span i18n>Health Care</span>
  <ng-template #listSearch>
    <planet-search-field label="Search name..." i18n-label [(value)]="searchValue"></planet-search-field>
  </ng-template>
</planet-list-toolbar>

<div class="space-container">
  <planet-users-table #table [users]="users" [search]="searchValue" [filter]="{}" [(tableState)]="tableState" [displayedColumns]="displayedColumns" containerClass="view-container view-full-height view-table" (tableDataChange)="tableDataChange($event)"></planet-users-table>
</div>
