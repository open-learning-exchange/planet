<div class="full-container">
  <div class="chat-container" #chat>
    @for (conversation of conversations; track trackByFn($index, conversation)) {
      <div>
        <planet-markdown class="conversation-query" [content]="conversation.query" profile="chat"></planet-markdown>
        <planet-markdown [ngClass]="{'conversation-error': conversation.error, 'conversation-response': !conversation.error}" [content]="conversation.response" profile="chat"></planet-markdown>
      </div>
    }
  </div>

  <div class="form-container">
    <form [formGroup]="promptForm" class="form-space" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label i18n>Chat</mat-label>
        <textarea #chatInput matInput [formControl]="promptForm.controls.prompt" rows="5" placeholder="Send a message" i18n-placeholder></textarea>
        <span
          class="send-button-wrapper"
          matIconSuffix
          [matTooltip]="sendUnavailableReason"
          [attr.tabindex]="sendUnavailableReason ? 0 : null"
          [attr.role]="sendUnavailableReason ? 'group' : null"
          aria-label="Send message" i18n-aria-label>
          <button
            mat-icon-button
            aria-label="Send message" i18n-aria-label
            [planetSubmit]="promptForm.valid && spinnerOn"
            [disabled]="!promptForm.valid || providers.length === 0 || !spinnerOn"
            color="primary"
            >
            <mat-icon>send</mat-icon>
          </button>
        </span>
      </mat-form-field>
    </form>
  </div>
</div>
