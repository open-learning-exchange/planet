<div [ngClass]="{ 'space-container': !isDialog }">
  <mat-toolbar class="primary-color font-size-1">
    @if (!isLoading) {
      <span class="toolbar-title-block">
        <span class="ellipsis-title">{{title ? title + ': ' : ''}}</span>
        <span class="question-count-text">
          <ng-container i18n>Question</ng-container>{{' ' + questionNum + ' '}}<ng-container i18n>of</ng-container>{{' ' + maxQuestions }}
        </span>
        <ng-content select="[exam-frame-title-extra]"></ng-content>
      </span>
    }
    <span class="toolbar-fill"></span>
    @if (!isLoading && elapsedSeconds !== null && elapsedSeconds !== undefined) {
      <button
        type="button"
        class="elapsed-time-chip km-elapsed-time-chip"
        [class.elapsed-time-chip--hidden]="isTimerHidden"
        (click)="toggleTimer()"
        [title]="timerTooltip"
        [attr.aria-label]="timerAriaLabel">
        <mat-icon class="timer-icon" aria-hidden="true">schedule</mat-icon>
        @if (isTimerHidden) {
          <span class="timer-text timer-text--hidden" i18n>Hidden</span>
          <mat-icon class="timer-visibility-icon" aria-hidden="true">visibility_off</mat-icon>
        } @else {
          <span class="timer-text">{{ formattedElapsedTime }}</span>
          <mat-icon class="timer-visibility-icon" aria-hidden="true">visibility</mat-icon>
        }
      </button>
    }
    <button mat-icon-button [disabled]="disablePrevious" (click)="previous.emit()" title="Previous question" i18n-title><mat-icon>navigate_before</mat-icon></button>
    <button mat-icon-button [disabled]="disableNext" (click)="next.emit()" title="Next question" i18n-title><mat-icon>navigate_next</mat-icon></button>
  </mat-toolbar>
  @if (!isLoading && maxQuestions > 0) {
    <div class="progress-bar-track">
      <div class="progress-bar-fill" [style.width.%]="progressPercent"></div>
    </div>
  }
  <div class="view-container" [ngClass]="{ 'view-full-height': !isDialog }">
    @if (!isLoading) {
      <div [ngClass]="slideClass">
        <ng-content></ng-content>
      </div>
    } @else {
      <planet-loading-spinner text="Loading content..." i18n-text></planet-loading-spinner>
    }
  </div>
</div>
