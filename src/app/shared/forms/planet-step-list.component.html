@if (listMode) {
  <mat-nav-list [disableRipple]="ignoreClick" [ngClass]="{ 'no-pointer': ignoreClick }">
    @for (stepListItem of stepListItems; track stepListItem; let i = $index) {
      <mat-list-item (click)="stepClick(i)">
        <ng-template [ngTemplateOutlet]="stepListItem.template"></ng-template>
      </mat-list-item>
    }
  </mat-nav-list>
}
@if (!listMode) {
  <div class="planet-step-list-form-container">
    <div class="action-buttons">
      <button mat-icon-button type="button" (click)="toList()" matTooltip="Return to List" i18n-matTooltip aria-label="Return to List" i18n-aria-label><mat-icon>list</mat-icon></button>
      <span class="planet-step-list-number"><ng-content select="[planetStepListNumber]"></ng-content></span>
      <button mat-icon-button type="button" [disabled]="this.openIndex === 0" (click)="changeStep(-1)" matTooltip="Previous" i18n-matTooltip aria-label="Previous" i18n-aria-label><mat-icon>chevron_left</mat-icon></button>
      <button mat-icon-button type="button" [disabled]="this.openIndex >= (this.stepListItems.length - 1)" (click)="changeStep(1)" matTooltip="Next" i18n-matTooltip aria-label="Next" i18n-aria-label><mat-icon>chevron_right</mat-icon></button>
      <button mat-icon-button type="button" color="warn" (click)="removeStep()" matTooltip="Delete" i18n-matTooltip aria-label="Delete" i18n-aria-label><mat-icon>delete</mat-icon></button>
    </div>
    <ng-content select="[planetStepListForm]"></ng-content>
    <ng-content select="[planetStepListActions]"></ng-content>
  </div>
}
