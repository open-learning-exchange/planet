# CodeRabbit for Planet. Reviews are opt-in: label a PR `review` and it gets
# reviewed, then re-reviewed on each push. Unlabelled PRs are never reviewed.
# Since a review only runs when asked for, ceremony is off and substance is up
# -- a labelled PR answered "LGTM" wasted the ask.
# https://docs.coderabbit.ai/reference/configuration
language: "en-US"

tone_instructions: >-
  Correctness first: bugs, security, data loss. Then the conventions in
  AGENTS.md and Style-Guide.md. Skip whatever eslint, sass-lint and htmlhint
  already report. No compliments, no restating the diff.

reviews:
  profile: assertive

  # Each defaults on; none is why anyone labels a PR.
  sequence_diagrams: false
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  review_status: false  # else a "Review skipped" notice on every unlabelled PR

  # How a Claude or Codex session applies a finding without a human retyping it.
  enable_prompt_for_ai_agents: true

  # The pre-merge table, all four rows. The key is `docstrings`, not
  # `docstring_coverage` -- unknown keys here validate silently and do nothing.
  pre_merge_checks:
    docstrings: { mode: "off" }
    title: { mode: "off" }
    description: { mode: "off" }
    issue_assessment: { mode: "off" }

  # Drops the "Finishing Touches" checkbox block. autofix, fix_ci and
  # resolve_merge_conflict stay on: those only render when they apply.
  finishing_touches:
    docstrings: { enabled: false }
    unit_tests: { enabled: false }

  path_filters:
    - "!package-lock.json"
    - "!src/i18n/messages*.xlf"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"

  path_instructions:
    - path: "src/app/**"
      instructions: >-
        Database access goes through CouchDbService (setOpts / couchDBReq) or
        the PouchDB services -- flag raw HttpClient calls at CouchDB.
        Validators belong in src/app/validators/. Flag hard-coded colors and
        breakpoints (use _variables.scss, mat-color(), the screen-sizes mixin)
        and the reserved names planet-db-host and planet-db-port. Features are
        lazy-loaded per directory: flag imports reaching into another feature.
    - path: "src/app/**/*.html"
      instructions: >-
        Flag i18n on an element whose only content is an interpolation, real
        text carrying no i18n, and attribute strings missing i18n-<attr>.
        km- prefixed classes are unit-test hooks: flag any that surface in a
        stylesheet, and flag removing one a spec still queries.
    - path: "gateway/**"
      instructions: >-
        A separate service on the legacy eslint config; credentials and models
        come from the CouchDB configurations doc -- flag keys read from env
        vars or hard-coded.
    - path: "design/**"
      instructions: >-
        CouchDB map/reduce views. A changed view only takes effect once
        couchdb-setup.sh re-uploads it -- flag changes that assume otherwise.

  auto_review:
    # enabled false + a positive label is CodeRabbit's opt-in idiom: the label
    # starts the review, auto_incremental_review follows each push after that.
    enabled: false
    labels: ["review"]
    auto_incremental_review: true
    drafts: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "Style-Guide.md"
